<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — SisQo Dev</title>
  <meta name="description" content="{{EXCERPT}}" />
  <meta name="author" content="Francesco Limberti" />
  <link rel="canonical" href="https://sisqo.dev/blog/{{SLUG}}" />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#f2efe7" />

  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="sisqo.dev" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{EXCERPT}}" />
  <meta property="og:url" content="https://sisqo.dev/blog/{{SLUG}}" />
  <meta property="og:locale" content="en_US" />
  <meta property="article:published_time" content="{{DATE_ISO}}" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{EXCERPT}}" />

  <link rel="alternate" type="application/rss+xml" title="SisQo Dev — Blog" href="/blog/rss.xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/blog.css" />
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="brand">sisqo.dev</a>
    <nav class="site-nav">
      <a href="/">home</a>
      <a href="/blog" aria-current="page">blog</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <header class="post-header">
    <div class="eyebrow"><a href="/blog">← Blog</a></div>
    <h1 class="post-page-title">{{TITLE}}</h1>
    <div class="post-meta">
      <span class="post-date">{{DATE_DISPLAY}}</span>
      <span class="post-tags">{{TAG_PILLS}}</span>
    </div>
  </header>

  <div class="post-body">
    <div class="post-aside"></div>
    <article class="post-prose">
{{CONTENT}}
    </article>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="foot-row">
      <a href="https://github.com/sisqo">github ↗</a>
      <p class="foot-copy">© 2026 SisQo Dev</p>
    </div>
  </div>
</footer>

<script defer src="/assets/blog.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
